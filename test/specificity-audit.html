  rec: '<div class="proactive-recommendation"><div class="proactive-recommendation-bubble"><div class="proactive-recommendation-card">c</div></div>' +
    '<div class="music-recommendation-bubble"><div class="music-recommendation-icon">i</div></div>' +

  legacy: '<div id="textInputBox"><button id="sendButton">s</button><button id="textSendButton">t</button></div>',
  pluginLayer: '<div id="agent-plugin-views"><div id="agent-plugin-content"><div class="agent-plugin-view">v</div></div></div>',
  linky: '<div id="nts-linky"><a href="#">plain link</a></div>'
};
var host = document.getElementById('nts-mount');
for (var k in FIXTURES) {
  var w = document.createElement('div');
  w.className = 'nts-fixture nts-fixture-' + k; w.innerHTML = FIXTURES[k]; host.appendChild(w);
}

/* --- specificity: (a=#id, b=.class/[attr]/:pseudo-class, c=element/::pseudo-element) --- */
function stripStrings(s) { return s.replace(/"[^"]*"|'[^']*'/g, '""'); }
function specOf(sel) {
  /* take the most specific compound of a comma list, and drop combinator context we cannot
     evaluate: we only need an upper bound comparison, so use the LAST compound. */
  var parts = sel.split(',').map(function (s) { return s.trim(); });
  var best = { a: 0, b: 0, c: 0, s: '' };
  parts.forEach(function (p) {
    var s = stripStrings(p), a = 0, b = 0, c = 0;
    var idRe = /#[A-Za-z_][\w-]*/g; a = (s.match(idRe) || []).length;
    s = s.replace(idRe, ' ');
    var attrRe = /\[[^\]]*\]/g; b += (s.match(attrRe) || []).length;
    s = s.replace(attrRe, ' ');
    var pcRe = /:[a-zA-Z-]+(\([^)]*\))?/g;
    var pcs = s.match(pcRe) || [];
    /* ::before/::after are pseudo-ELEMENTS -> column c */
    var pe = pcs.filter(function (x) { return x.indexOf('::') === 0 || /^:(before|after|first-line|first-letter|placeholder|selection|marker|backdrop)$/.test(x); });
    b += pcs.length - pe.length; c += pe.length;
    s = s.replace(pcRe, ' ');
    var clsRe = /\.[A-Za-z_][\w-]*/g; b += (s.match(clsRe) || []).length;
    s = s.replace(clsRe, ' ');
    var elRe = /(?<![:\w-])([a-zA-Z][\w-]*|\*)/g; c += (s.match(elRe) || []).length;
    var cand = { a: a, b: b, c: c, s: p };
    if (cand.a > best.a || (cand.a === best.a && (cand.b > best.b || (cand.b === best.b && cand.c >= best.c)))) best = cand;
  });
  return best;
}
function cmp(x, y) { return x.a - y.a || x.b - y.b || x.c - y.c; }

function splitPseudo(sel) {
  var i = sel.indexOf('::');
  return i >= 0 ? { base: sel.slice(0, i), pseudo: sel.slice(i) } : { base: sel, pseudo: null };
}
function isOursRule(rule) {
  try { return (rule.parentStyleSheet && (rule.parentStyleSheet.href || '').indexOf('neko-theme-studio.css') >= 0); }
  catch (e) { return false; }
}

function auditTarget(t) {
  var sp = splitPseudo(t.sel);
  if (/:(hover|focus|focus-visible|focus-within|active)\b/.test(sp.base)) return null;
  var el = null;
  try { el = sp.base ? document.querySelector(sp.base) : document.body; } catch (e) { return null; }
  if (!el) return null;

  var props = [t.prop];
  if (t.prop === 'border-radius') {
    props = ['border-top-left-radius', 'border-top-right-radius', 'border-bottom-right-radius', 'border-bottom-left-radius'];
  }
  var cands = [];
  for (var i = 0; i < document.styleSheets.length; i++) {
    var sh = document.styleSheets[i], rules;
    try { rules = sh.cssRules || sh.rules; } catch (e) { continue; }
    if (!rules) continue;
    var href = sh.href || '(inline)';
    for (var j = 0; j < rules.length; j++) {
      var r = rules[j];
      if (r.type !== 1 && r.selectorText === undefined) continue;   /* skip @media wrappers: handled below */
      collect(r, href);
    }
    function collect(r, href) {
      if (r.cssRules && r.selectorText === undefined) {   /* @media / @supports */
        for (var k = 0; k < r.cssRules.length; k++) collect(r.cssRules[k], href);
        return;
      }
      if (!r.selectorText) return;
      var s = r.selectorText;
      /* only rules that could match this element; pseudo-element selectors still count,
         so strip ::pseudo for the matches() test */
      var test = s.replace(/::[a-zA-Z-]+(\([^)]*\))?/g, '');
      var matched = false;
      try {
        var list = test.split(',').map(function (x) { return x.trim(); });
        for (var q = 0; q < list.length && !matched; q++) {
          var one = list[q];
          if (!one) continue;
          if (sp.pseudo && one !== sp.base && one.indexOf(sp.base) < 0) { /* keep it simple, still test */ }
          try { if (el.matches(one)) matched = true; } catch (e2) { if (el.matches(sp.base)) matched = true; }
        }
      } catch (e3) { matched = true; }
      if (!matched) return;
      for (var p = 0; p < props.length; p++) {
        var v = r.style.getPropertyValue(props[p]);
        if (!v) continue;
        cands.push({
          sel: s, prop: props[p], val: v,
          important: r.style.getPropertyPriority(props[p]) === 'important',
          spec: specOf(s), ours: isOursRule(r), sheet: href.split('/').pop()
        });
      }
    }
  }
  return { target: t.sel + ' | ' + t.prop, var: t.v, props: props, cands: cands };
}

function run() {
  var out = { theme: document.documentElement.getAttribute('data-theme') || 'light', rows: [], winners: [] };
  try {
    for (var i = 0; i < NTS_TARGETS.length; i++) {
      var t = NTS_TARGETS[i];
      if (t.aux) continue;
      var a = auditTarget(t);
      if (!a) continue;
      /* winner per property: important first, then specificity, then source order (we do not
         track order precisely; ties are reported so a human can see them) */
      a.props.forEach(function (prop) {
        var cs = a.cands.filter(function (c) { return c.prop === prop; });
        if (!cs.length) return;
        cs.sort(function (x, y) {
          if (x.important !== y.important) return x.important ? -1 : 1;
          var d = cmp(y.spec, x.spec); if (d) return d;
          return (y.ours ? 1 : 0) - (x.ours ? 1 : 0);
        });
        var top = cs[0];
        var oursTop = cs.filter(function (c) { return c.ours; })[0];
        var outranked = oursTop && (top.important && (!oursTop.important || cmp(top.spec, oursTop.spec) > 0));
        var amb = cs.filter(function (c) {
          return c.important === top.important && cmp(c.spec, top.spec) === 0;
        }).length > 1;
        if (outranked || amb) {
          out.winners.push({
            target: a.target, prop: prop, ourVar: a.var,
            ours: oursTop ? { sel: oursTop.sel, spec: fmt(oursTop.spec), important: oursTop.important, sheet: oursTop.sheet } : null,
            top: { sel: top.sel, spec: fmt(top.spec), important: top.important, val: top.val, sheet: top.sheet, ours: !!top.ours },
            outranked: !!outranked, ambiguous: !!amb,
            all: cs.slice(0, 6).map(function (c) {
              return (c.ours ? 'OURS ' : '     ') + fmt(c.spec) + (c.important ? ' !imp' : '     ') + '  ' + c.sel + '  [' + c.sheet + '] = ' + c.val;
            })
          });
        }
      });
    }
  } catch (e) { out.error = String((e && e.stack) || e); }
  document.getElementById('nts-out').textContent = JSON.stringify(out);
  document.title = 'NTS-DONE';
}
function fmt(s) { return '(' + s.a + ',' + s.b + ',' + s.c + ')'; }

if (document.readyState === 'complete') run();
else window.addEventListener('load', run, false);
</script>
